name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: PHP lint (${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3']
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: phpcs, composer:v2

      - name: Syntax-check every PHP file
        run: |
          set -e
          find ridefleet-ai-chatbot ridefleet-booking -name '*.php' -print0 \
            | xargs -0 -n1 -P4 php -l

      - name: Cache WPCS standards
        uses: actions/cache@v4
        with:
          path: ~/.composer/vendor
          key: wpcs-${{ runner.os }}

      - name: Install WordPress Coding Standards
        run: |
          composer global require --no-interaction --no-progress \
            squizlabs/php_codesniffer wp-coding-standards/wpcs:dev-develop \
            phpcompatibility/phpcompatibility-wp dealerdirect/phpcodesniffer-composer-installer
          phpcs -i

      - name: Run WPCS (advisory)
        continue-on-error: true
        run: |
          phpcs --standard=WordPress \
                --ignore='*/vendor/*,*/node_modules/*,*/tests/*' \
                --extensions=php \
                --report=summary \
                ridefleet-ai-chatbot ridefleet-booking

  test:
    name: PHPUnit smoke tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2

      - name: Install test dependencies
        working-directory: tests
        run: composer install --no-interaction --no-progress

      - name: Run smoke tests
        working-directory: tests
        run: ./vendor/bin/phpunit --testdox
